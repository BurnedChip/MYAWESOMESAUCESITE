<!DOCTYPE html>
<html lang="en">
    <head>
         <link rel="icon" href="lance.png">
        <style>
            body {
                background-image: url(lance.png );
                background-repeat: repeat;
                background-color: rgb(98, 1, 255);
                animation: movebackround 2s linear infinite
            }

            @keyframes movebackround{
                from{
                    background-position: 0 0;
                }
                to{
                    background-position: 0px 500px;
                }
            }

            .container{
                background-color: blueviolet;
                text-align: center;
                width: 650px;
                height: 100px;
                border: blue;
                border-width: 3px;
                border-style: dashed;
                margin: 0 auto;

            }

            .imagecontainer{
                background-color: crimson;
                width: 650px;
                height: 10000px;
                text-align: center;
                border: red;
                border-style: inset;
                border-width: 10px;
                margin: 0 auto;

            }

            button{
                background-color: aqua;
                text-align: center;
                align-self: center;

            }

            button:hover{
                background-color: blue;

            }

            .buttonrack2{
                width: 650px;
                height: 100px;
                margin: 0 auto;
                border: blue;
                align-self: center;
                align-items: center;
                background-color: chartreuse;
                text-align: center;

            }
        </style>
    </head>
    <body>
      <div class="container">
        <h1>IMAGE GALLERY</h1>
      </div>
      
    <div class="buttonrack2">
        <a href="index.html">
            <Button class="button">
                <h5>HOMEPAGE</h5>
            </Button>
        </a>
    </div>

      <div class="imagecontainer">
        <img src="bigG.png" alt="bigG" width="645">
        <img src="jackson.jpeg" alt="jackSON" width="645">
        <img src="edgar.jpeg" alt="edgar" width="645">
        <img src="jackSONN.jpeg" alt="jacksonn" width="645">
        <img src="aurason.jpeg" alt="aurason" width="645">
      </div>
    </body>
</html>
