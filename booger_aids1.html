<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            body {
                background-image: url(lance.png );
                background-repeat: repeat;
                background-color: rgb(98, 1, 255);
                animation: movebackround 2s linear infinite
            }

            @keyframes movebackround{
                from{
                    background-position: 0 0;
                }
                to{
                    background-position: 0px 500px;
                }
            }

            .container{
                background-image: linear-gradient(rgb(252, 1, 123), rgb(102, 0, 255), rgb(0, 225, 0));
                text-align: center;
                width: 800px;
                height: auto;
                border: blue;
                border-width: 3px;
                border-style: dashed;
                margin: 0 auto;

            }

            .imagecontainer{
                background-color: crimson;
                width: 650px;
                height: auto;
                text-align: center;
                border: red;
                border-style: inset;
                border-width: 10px;
                margin: 0 auto;
                margin-bottom: 50px;

            }

            button{
                background-color: aqua;
                text-align: center;
                align-self: center;

            }

            button:hover{
                background-color: blue;

            }

            .buttonrack2{
                width: 650px;
                height: 100px;
                margin: 0 auto;
                border: blue;
                align-self: center;
                align-items: center;
                background-color: chartreuse;

            }
        </style>
    </head>
    <body>
      <div class="container">
        <h1>IMAGE GALLERY</h1>
           
        <div class="buttonrack2">
            <a href="index.html">
                <Button class="button">
                    <h5>HOMEPAGE</h5>
                </Button>
            </a>
        </div>

          <div class="imagecontainer">
            <img src="bigG.png" alt="bigG" width="645">
            <img src="jackson.jpeg" alt="jackSON" width="645">
            <img src="edgar.jpeg" alt="edgar" width="645">
            <img src="jackSONN.jpeg" alt="jacksonn" width="645">
            <img src="aurason.jpeg" alt="aurason" width="645">
          </div>
      </div>
    </body>
</html>
